# CD — CI → build imagen → GHCR → deploy por SSH al droplet (deploy/deploy.sh)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase image name
        id: image
        run: |
          name="${REGISTRY}/${IMAGE_NAME,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "ref=$name:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DOMAIN && format('https://{0}/dashboard', vars.DOMAIN) || '' }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validar secrets
        env:
          HAS_HOST: ${{ secrets.DROPLET_HOST != '' }}
          HAS_USER: ${{ secrets.DROPLET_USER != '' }}
          HAS_KEY: ${{ secrets.DROPLET_SSH_KEY != '' }}
          HAS_PATH: ${{ secrets.DEPLOY_PATH != '' }}
        run: |
          missing=()
          [ "$HAS_HOST" = true ] || missing+=("DROPLET_HOST")
          [ "$HAS_USER" = true ] || missing+=("DROPLET_USER")
          [ "$HAS_KEY" = true ]  || missing+=("DROPLET_SSH_KEY")
          [ "$HAS_PATH" = true ] || missing+=("DEPLOY_PATH")
          if [ ${#missing[@]} -gt 0 ]; then
            printf '::error::Falta el secret %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose, Caddyfile and deploy scripts to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          source: "docker-compose.prod.yml,Caddyfile,deploy"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ needs.build-and-push.outputs.image }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          command_timeout: 15m
          envs: IMAGE_REF,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash "$DEPLOY_PATH/deploy/deploy.sh" "$IMAGE_REF"

      - name: Smoke test HTTPS
        if: vars.DOMAIN != ''
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 \
            "https://$DOMAIN/health"

# CD — build imagen → GHCR → deploy por SSH al droplet
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LEAD_WEBHOOK_TOKEN: ci-lead-token
      ADMIN_API_TOKEN: ci-admin-token
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost/gateway
      ODOO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Opcional: descomenta para approvals / secrets por environment
    # environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Downcase image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Copy compose + Caddyfile to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ghcr.io/${{ steps.image.outputs.name }}:${{ steps.sha.outputs.short }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE_REF,DEPLOY_PATH,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              echo "Missing .env in $DEPLOY_PATH — create it once on the droplet (from .env.example)." >&2
              exit 1
            fi
            if [ ! -f Caddyfile ]; then
              echo "Missing Caddyfile in $DEPLOY_PATH" >&2
              exit 1
            fi

            if [ ! -S /var/run/docker.sock ]; then
              echo "ERROR: /var/run/docker.sock no existe. Instala Docker Engine (docs/deploy.md)." >&2
              exit 1
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "ERROR: 'docker info' falló. sudo usermod -aG docker \$USER && re-login" >&2
              exit 1
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "ERROR: falta plugin 'docker compose' v2." >&2
              exit 1
            fi

            if systemctl is-active --quiet caddy 2>/dev/null; then
              sudo systemctl disable --now caddy || true
            fi

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            mkdir -p knowledge_uploads
            chmod 777 knowledge_uploads || true

            export GATEWAY_IMAGE="$IMAGE_REF"
            echo "GATEWAY_IMAGE=$GATEWAY_IMAGE" > .deploy.env

            docker compose -f docker-compose.prod.yml --env-file .deploy.env pull api caddy
            docker compose -f docker-compose.prod.yml --env-file .deploy.env up -d
            docker image prune -f

            echo "Waiting for health (API localhost)..."
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
                DOMAIN_VAL=$(grep -E '^DOMAIN=' .env | head -1 | cut -d= -f2- | tr -d '"' | tr -d "'" || true)
                echo "Deploy OK: $GATEWAY_IMAGE"
                if [ -n "$DOMAIN_VAL" ]; then
                  echo "HTTPS: https://${DOMAIN_VAL}/dashboard"
                fi
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed" >&2
            docker compose -f docker-compose.prod.yml --env-file .deploy.env logs --tail=80 api caddy
            exit 1

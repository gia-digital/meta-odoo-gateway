# CI — tests en cada PR (en main el gate de tests vive en Deploy)
name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LEAD_WEBHOOK_TOKEN: ci-lead-token
      ADMIN_API_TOKEN: ci-admin-token
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost/gateway
      ODOO_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

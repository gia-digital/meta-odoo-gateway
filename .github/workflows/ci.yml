# CI — tests en cada push/PR
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      META_VERIFY_TOKEN: ci-verify-token
      META_APP_SECRET: ci-app-secret
      META_ACCESS_TOKEN: ci-access-token
      META_LEAD_WEBHOOK_TOKEN: ci-lead-token
      ADMIN_API_TOKEN: ci-admin-token
      DATABASE_URL: postgresql+asyncpg://gateway:gateway@localhost/gateway
      ODOO_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

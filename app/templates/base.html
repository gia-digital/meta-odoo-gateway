<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Lead Gateway{% endblock %}</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>
  {% if active_nav is defined %}
  <header class="topbar">
    <div class="brand">Meta Lead Gateway</div>
    <nav>
      <a href="/dashboard/leads" class="{% if active_nav == 'leads' %}active{% endif %}">Leads</a>
      <a href="/dashboard/conversations" class="{% if active_nav == 'conversations' %}active{% endif %}">Conversaciones</a>
    </nav>
    <form method="post" action="/dashboard/logout" class="logout-form">
      <button type="submit">Salir</button>
    </form>
  </header>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

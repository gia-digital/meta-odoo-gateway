<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>{% block title %}GIA · Prospectos{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if active_nav is defined %}
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">GIA</span>
        <div class="brand-text">
          <span class="brand-name">Grupo Industrial Acerero</span>
          <span class="brand-sub">Prospectos · Ventas</span>
        </div>
      </div>
      <nav class="nav-pills" aria-label="Principal">
        <a href="/dashboard/overview" class="{% if active_nav == 'overview' %}active{% endif %}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 12.5V7.5M6.5 12.5V3.5M10.5 12.5v-3M13.5 12.5V5.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Resumen
        </a>
        <a href="/dashboard/leads" class="{% if active_nav == 'leads' %}active{% endif %}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Prospectos
        </a>
        <a href="/dashboard/conversations" class="nav-secondary {% if active_nav == 'conversations' %}active{% endif %}">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 3.5h10a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H7l-3 2.5V4.5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
          Conversaciones
        </a>
      </nav>
      <form method="post" action="/dashboard/logout" class="logout-form">
        <button type="submit">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 3H3.5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1H6M10.5 11.5L14 8l-3.5-3.5M14 8H6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Salir
        </button>
      </form>
    </div>
  </header>
  {% endif %}
  <main class="{% block main_class %}container{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>

{% extends "base.html" %}
{% block title %}Login — Lead Gateway{% endblock %}
{% block content %}
<section class="login-card">
  <h1>Dashboard</h1>
  <p class="muted">Usa el mismo token que <code>ADMIN_API_TOKEN</code>.</p>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/dashboard/login">
    <label for="token">Token de administración</label>
    <input id="token" name="token" type="password" required autofocus />
    <button type="submit">Entrar</button>
  </form>
</section>
{% endblock %}

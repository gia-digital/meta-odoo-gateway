services:
  api:
    build: .
    container_name: meta-odoo-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./knowledge_uploads:/app/knowledge_uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gateway-net

  db:
    image: pgvector/pgvector:pg16
    container_name: gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

volumes:
  gateway-pgdata:

networks:
  gateway-net:
    driver: bridge

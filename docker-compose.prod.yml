# Producción en DigitalOcean droplet.
# La imagen la construye GitHub Actions y se publica en GHCR.
# Caddy termina TLS (Let's Encrypt) y hace reverse proxy a la API.
#
# Requisitos en .env del droplet:
#   DOMAIN=gia.init.com.mx
#   ACME_EMAIL=ops@tuempresa.com
#
# Uso (deploy/deploy.sh lo hace en cada deploy):
#   export GATEWAY_IMAGE=ghcr.io/gia-digital/meta-odoo-gateway:abc1234
#   docker compose -f docker-compose.prod.yml --env-file .deploy.env up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to ghcr.io/<org>/<repo>:<tag>}
    container_name: meta-odoo-gateway
    restart: unless-stopped
    env_file: .env
    # Solo localhost: healthchecks / debug. Público vía Caddy :443
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./knowledge_uploads:/app/knowledge_uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: meta-odoo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-gia.init.com.mx}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gateway-net
    logging: *default-logging

  db:
    image: pgvector/pgvector:pg16
    container_name: gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net
    logging: *default-logging

  # pg_dump diario en backups/scheduled/{daily,weekly,monthly}. Restaurar: deploy/restore.sh
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: gateway-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_EXTRA_OPTS: "-Z6 --clean --if-exists --no-owner"
      SCHEDULE: "@daily"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      TZ: America/Mexico_City
    volumes:
      - ./backups/scheduled:/backups
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gateway-net
    logging: *default-logging

volumes:
  gateway-pgdata:
  caddy_data:
  caddy_config:

networks:
  gateway-net:
    driver: bridge

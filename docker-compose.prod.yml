# Producción en DigitalOcean droplet.
# La imagen la construye GitHub Actions y se publica en GHCR.
#
# Uso:
#   export GATEWAY_IMAGE=ghcr.io/gia-digital/meta-odoo-gateway:abc1234
#   docker compose -f docker-compose.prod.yml up -d

services:
  api:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to ghcr.io/<org>/<repo>:<tag>}
    container_name: meta-odoo-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  db:
    image: postgres:16-alpine
    container_name: gateway-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: gateway
    volumes:
      - gateway-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net

volumes:
  gateway-pgdata:

networks:
  gateway-net:
    driver: bridge
